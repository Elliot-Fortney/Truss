<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PROTOTYPE: React Flow scale</title>
    <style>
      html, body, #root { margin: 0; height: 100%; font: 12px system-ui, sans-serif; }
      .banner { position: fixed; z-index: 10; top: 0; left: 0; right: 0; padding: 4px 8px; background: #fde68a; }
      .stack { width: 100%; height: 100%; border: 2px dashed #94a3b8; border-radius: 8px; background: rgba(148,163,184,.06); }
      .stack span { position: absolute; top: 6px; left: 10px; font-weight: 600; color: #475569; }
      .truss { width: 100%; height: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }
      .truss.open { background: rgba(255,153,0,.05); border-color: #ff9900; }
      .truss .head { display: flex; align-items: center; gap: 6px; padding: 6px; }
      .truss .icon { flex: none; width: 26px; height: 26px; border-radius: 4px; color: #fff; font-size: 10px; display: grid; place-items: center; }
      .truss .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .truss button { flex: none; width: 20px; height: 20px; padding: 0; }
      .react-flow__node-truss, .react-flow__node-stack { padding: 0; border: 0; }
      .react-flow__node-stack { pointer-events: none; }
      .kind-grant path { stroke: #dc2626; } .kind-integration path { stroke: #2563eb; } .kind-network path { stroke-dasharray: 4 3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createRoot } from 'react-dom/client';
      import { createElement } from 'react';
      import App from '/src/App.jsx';
      createRoot(document.getElementById('root')).render(createElement(App));
    </script>
  </body>
</html>
